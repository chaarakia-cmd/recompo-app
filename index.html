<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Carnet de Musculation - 160 Jours</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #ff4757;
            --accent-green: #2ed573;
            --text-main: #ffffff;
            --text-muted: #a4b0be;
            --border-color: #2f3542;
        }

        * {
            box-sizing: border-box;
            touch-action: manipulation;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            padding-bottom: 90px;
        }

        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .nav-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .session-title {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
        }

        .exercise-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .exercise-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .exercise-target {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .previous-perf {
            background: #252a34;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            color: #eccc68;
            margin-bottom: 12px;
        }

        .set-row {
            display: grid;
            grid-template-columns: 50px 1fr 1fr;
            gap: 10px;
            align-items: center;
            margin-bottom: 8px;
        }

        .set-label {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-muted);
        }

        input {
            background: #2f3542;
            border: 1px solid var(--border-color);
            color: white;
            padding: 8px;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
            width: 100%;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* Timer de repos flottant */
        .timer-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #2f3542;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid var(--accent);
        }

        .timer-display {
            font-size: 20px;
            font-weight: bold;
            font-family: monospace;
        }

        .timer-btn {
            background: var(--accent-green);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
        }

        .utility-actions {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .util-btn {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="header-nav">
        <button class="nav-btn" id="prevBtn" onclick="changeSession(-1)">↩ Séance préc.</button>
        <div class="session-title" id="sessionTitle">Séance 1</div>
        <button class="nav-btn" id="nextBtn" onclick="changeSession(1)">Séance suiv. ↪</button>
    </div>

    <div id="workoutContainer"></div>

    <div class="utility-actions">
        <button class="util-btn" onclick="exportData()">Exporter données</button>
        <button class="util-btn" onclick="resetCurrentSession()">Effacer cette séance</button>
    </div>

    <div class="timer-bar">
        <div>Repos : <span class="timer-display" id="timerDisplay">00:00</span></div>
        <div>
            <button class="timer-btn" onclick="startTimer(45)">45s</button>
            <button class="timer-btn" onclick="startTimer(90)">90s</button>
            <button class="timer-btn" onclick="startTimer(120)">120s</button>
        </div>
    </div>

<script>
// Structure de la programmation
const program = [
    {
        id: 1,
        name: "Séance 1 — Push (Haut du corps)",
        exercises: [
            { id: "s1_e1", name: "Développé couché barre", target: "4 séries × 6-8 reps", sets: 4 },
            { id: "s1_e2", name: "Développé militaire haltères", target: "3 séries × 8-10 reps", sets: 3 },
            { id: "s1_e3", name: "Dips assistés", target: "3 séries × 10-12 reps", sets: 3 },
            { id: "s1_e4", name: "Élévations latérales", target: "3 séries × 12-15 reps", sets: 3 },
            { id: "s1_e5", name: "Extension triceps poulie", target: "3 séries × 12-15 reps", sets: 3 }
        ]
    },
    {
        id: 2,
        name: "Séance 2 — Pull (Dos / Biceps)",
        exercises: [
            { id: "s2_e1", name: "Traction ou Tirage vertical", target: "4 séries × 8-10 reps", sets: 4 },
            { id: "s2_e2", name: "Rowing haltère / poulie", target: "3 séries × 8-10 reps", sets: 3 },
            { id: "s2_e3", name: "Oiseau / Facepull", target: "3 séries × 12-15 reps", sets: 3 },
            { id: "s2_e4", name: "Curl biceps incliné", target: "3 séries × 10-12 reps", sets: 3 }
        ]
    },
    {
        id: 3,
        name: "Séance 3 — Legs (Jambes / Abs)",
        exercises: [
            { id: "s3_e1", name: "Presse à cuisses / Squat", target: "4 séries × 8-10 reps", sets: 4 },
            { id: "s3_e2", name: "Leg Curl (Ischios)", target: "3 séries × 10-12 reps", sets: 3 },
            { id: "s3_e3", name: "Leg Extension", target: "3 séries × 12-15 reps", sets: 3 },
            { id: "s3_e4", name: "Mollets / Abdominaux", target: "4 séries × 15 reps", sets: 4 }
        ]
    }
];

let currentSessionIndex = 0;
let timerInterval = null;

// Initialisation
window.onload = function() {
    const savedIndex = localStorage.getItem('current_session_index');
    if (savedIndex !== null) {
        currentSessionIndex = parseInt(savedIndex);
    }
    renderSession();
};

function renderSession() {
    const session = program[currentSessionIndex];
    document.getElementById('sessionTitle').innerText = session.name;
    
    // Boutons navigation
    document.getElementById('prevBtn').disabled = (currentSessionIndex === 0);
    document.getElementById('nextBtn').disabled = (currentSessionIndex === program.length - 1);

    const container = document.getElementById('workoutContainer');
    container.innerHTML = '';

    session.exercises.forEach(exo => {
        const card = document.createElement('div');
        card.className = 'exercise-card';

        // Charger historique
        const historyKey = `prev_${exo.id}`;
        const lastPerf = localStorage.getItem(historyKey) || 'Aucune donnée précédente';

        let html = `
            <div class="exercise-title">${exo.name}</div>
            <div class="exercise-target">${exo.target}</div>
            <div class="previous-perf">Dernier coup : ${lastPerf}</div>
        `;

        for (let i = 1; i <= exo.sets; i++) {
            const weightKey = `data_${exo.id}_s${i}_w`;
            const repsKey = `data_${exo.id}_s${i}_r`;
            const savedWeight = localStorage.getItem(weightKey) || '';
            const savedReps = localStorage.getItem(repsKey) || '';

            html += `
                <div class="set-row">
                    <span class="set-label">S${i}</span>
                    <input type="number" step="0.5" placeholder="kg" value="${savedWeight}" 
                        onchange="saveData('${weightKey}', this.value); updateHistory('${exo.id}', ${exo.sets})">
                    <input type="number" placeholder="reps" value="${savedReps}" 
                        onchange="saveData('${repsKey}', this.value); updateHistory('${exo.id}', ${exo.sets})">
                </div>
            `;
        }

        card.innerHTML = html;
        container.appendChild(card);
    });
}

function saveData(key, val) {
    localStorage.setItem(key, val);
}

function updateHistory(exoId, totalSets) {
    let summary = [];
    for (let i = 1; i <= totalSets; i++) {
        const w = localStorage.getItem(`data_${exoId}_s${i}_w`);
        const r = localStorage.getItem(`data_${exoId}_s${i}_r`);
        if (w || r) {
            summary.push(`S${i}: ${w || 0}kg × ${r || 0}`);
        }
    }
    if (summary.length > 0) {
        localStorage.setItem(`prev_${exoId}`, summary.join(' | '));
    }
}

function changeSession(delta) {
    const newIndex = currentSessionIndex + delta;
    if (newIndex >= 0 && newIndex < program.length) {
        currentSessionIndex = newIndex;
        localStorage.setItem('current_session_index', currentSessionIndex);
        renderSession();
        window.scrollTo(0, 0);
    }
}

// Gestion du Chronomètre
function startTimer(seconds) {
    clearInterval(timerInterval);
    let remaining = seconds;
    const display = document.getElementById('timerDisplay');
    
    function updateDisplay() {
        const m = Math.floor(remaining / 60).toString().padStart(2, '0');
        const s = (remaining % 60).toString().padStart(2, '0');
        display.innerText = `${m}:${s}`;
    }

    updateDisplay();
    timerInterval = setInterval(() => {
        remaining--;
        if (remaining < 0) {
            clearInterval(timerInterval);
            display.innerText = "FIN !";
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        } else {
            updateDisplay();
        }
    }, 1000);
}

// Outils
function exportData() {
    let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(localStorage));
    let downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", "carnet_muscu_backup.json");
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
}

function resetCurrentSession() {
    if (confirm("Réinitialiser les cases de cette séance ?")) {
        const session = program[currentSessionIndex];
        session.exercises.forEach(exo => {
            for (let i = 1; i <= exo.sets; i++) {
                localStorage.removeItem(`data_${exo.id}_s${i}_w`);
                localStorage.removeItem(`data_${exo.id}_s${i}_r`);
            }
        });
        renderSession();
    }
}
</script>
</body>
</html>
