<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Recompo App</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --card-border: #27272a;
      --accent: #e11d48;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --input-bg: #27272a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 40px; }

    /* Top Navigation */
    .header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 20px; background: #000; border-bottom: 1px solid var(--card-border);
      position: sticky; top: 0; z-index: 100;
    }
    .header h1 { font-size: 1.2rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
    .menu-btn { background: none; border: none; color: var(--text); font-size: 1.5rem; cursor: pointer; }

    /* Drawer Menu */
    .menu-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 200; }
    .menu-drawer { position: fixed; top: 0; right: -80%; width: 80%; height: 100%; background: var(--card); border-left: 1px solid var(--card-border); transition: 0.3s ease; z-index: 201; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .menu-drawer.active { right: 0; }
    .menu-drawer button { background: var(--input-bg); border: none; color: var(--text); padding: 14px; text-align: left; font-size: 1rem; font-weight: 600; border-radius: 8px; }

    /* Container main */
    .container { padding: 16px; max-width: 500px; margin: 0 auto; }

    /* Day Counter Header */
    .day-banner {
      background: linear-gradient(135deg, #e11d48, #9f1239);
      border-radius: 12px; padding: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
    }
    .day-banner h2 { font-size: 1.5rem; font-weight: 900; }
    .day-banner span { font-size: 0.85rem; opacity: 0.9; }

    /* Exercise Card Focus */
    .ex-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
    .ex-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 10px; color: #fff; }

    .img-box { width: 100%; height: 200px; background: var(--input-bg); border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; overflow: hidden; border: 1px dashed #444; }
    .img-box img { width: 100%; height: 100%; object-fit: cover; }
    .upload-btn { background: #3f3f46; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; margin-bottom: 12px; }

    /* Sets Table Dynamic */
    .sets-header { display: grid; grid-template-columns: 40px 1fr 1fr; gap: 8px; text-align: center; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom: 8px; }
    .set-row { display: grid; grid-template-columns: 40px 1fr 1fr; gap: 8px; align-items: center; margin-bottom: 8px; }
    .set-num { font-weight: bold; color: var(--accent); text-align: center; }
    .set-row input { background: var(--input-bg); border: 1px solid var(--card-border); color: #fff; padding: 10px; text-align: center; border-radius: 8px; font-size: 1rem; font-weight: 600; width: 100%; }

    /* Navigation Buttons */
    .nav-actions { display: flex; gap: 10px; margin-top: 10px; }
    .btn-action { flex: 1; background: var(--accent); color: #fff; border: none; padding: 14px; border-radius: 10px; font-size: 0.95rem; font-weight: 700; text-transform: uppercase; cursor: pointer; text-align: center; }
    .btn-secondary { background: var(--input-bg); margin-top: 8px; }
    .btn-nav-prev { background: #3f3f46; }

    /* Views */
    .view-modal { display: none; background: var(--card); border-radius: 12px; padding: 20px; border: 1px solid var(--card-border); margin-top: 20px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Recompo App</h1>
    <button class="menu-btn" onclick="toggleMenu()">⋮</button>
  </div>

  <div class="menu-overlay" id="overlay" onclick="toggleMenu()"></div>
  <div class="menu-drawer" id="drawer">
    <h3 style="margin-bottom: 10px;">Menu</h3>
    <button onclick="showView('workout')">🏋️ Séance du jour</button>
    <button onclick="showView('guidelines')">📋 Consignes & Diète</button>
    <button onclick="showView('photos')">🖼️ Évolution Photos</button>
    <button onclick="showView('stats')">📈 Graphiques</button>
  </div>

  <div class="container">
    
    <!-- MAIN WORKOUT VIEW -->
    <div id="workout-view">
      <div class="day-banner">
        <div>
          <span id="date-today">Aujourd'hui</span>
          <h2 id="day-counter">JOUR 1</h2>
        </div>
        <span id="progression-tracker">Exo 1 / 4</span>
      </div>

      <!-- Single Exercise Mobile Focus -->
      <div id="exercise-container"></div>

      <div class="nav-actions">
        <button class="btn-action btn-nav-prev" id="prev-btn" onclick="prevExercise()" style="display:none">⬅ Précédent</button>
        <button class="btn-action" id="next-btn" onclick="nextExercise()">Suivant ➔</button>
      </div>
      <button class="btn-action btn-secondary" onclick="addSet()">+ Ajouter une série</button>
    </div>

    <!-- GUIDELINES VIEW -->
    <div id="guidelines-view" class="view-modal">
      <h2>Consignes Quotidiennes</h2>
      <br>
      <ul>
        <li>💧 <b>Eau :</b> 3 Litres par jour minimum.</li>
        <li>🥩 <b>Protéines :</b> Objectif quotidien fixé.</li>
        <li>🔥 <b>Calories :</b> Respecter les apports prévus.</li>
        <li>😴 <b>Sommeil :</b> 8h de récupération.</li>
      </ul>
      <button class="btn-action btn-secondary" onclick="showView('workout')">Fermer</button>
    </div>

    <!-- PHOTOS EVOLUTION VIEW -->
    <div id="photos-view" class="view-modal">
      <h2>Suivi Physique</h2>
      <br>
      <input type="file" id="evo-photo-input" accept="image/*" onchange="uploadEvoPhoto(event)" style="display:none">
      <button class="btn-action" onclick="document.getElementById('evo-photo-input').click()">Ajouter une photo</button>
      <div id="evo-photos-grid" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:15px;"></div>
      <button class="btn-action btn-secondary" onclick="showView('workout')">Fermer</button>
    </div>

    <!-- STATS VIEW -->
    <div id="stats-view" class="view-modal">
      <h2>Progression</h2>
      <canvas id="progressChart" style="margin-top:15px;"></canvas>
      <button class="btn-action btn-secondary" onclick="showView('workout')">Fermer</button>
    </div>

  </div>

  <script>
    let state = JSON.parse(localStorage.getItem('recompo_state')) || {
      currentDay: 1,
      currentExIndex: 0,
      exercisesData: {},
      photos: []
    };

    const defaultWorkout = [
      { name: "Développé Couché", sets: 4 },
      { name: "Incliné Haltères", sets: 3 },
      { name: "Écarté Câble", sets: 3 },
      { name: "Triceps Extension", sets: 4 }
    ];

    function saveData() {
      localStorage.setItem('recompo_state', JSON.stringify(state));
    }

    function toggleMenu() {
      const drawer = document.getElementById('drawer');
      const overlay = document.getElementById('overlay');
      drawer.classList.toggle('active');
      overlay.style.display = drawer.classList.contains('active') ? 'block' : 'none';
    }

    function showView(viewName) {
      if (document.getElementById('drawer').classList.contains('active')) toggleMenu();
      document.getElementById('workout-view').style.display = viewName === 'workout' ? 'block' : 'none';
      document.getElementById('guidelines-view').style.display = viewName === 'guidelines' ? 'block' : 'none';
      document.getElementById('photos-view').style.display = viewName === 'photos' ? 'block' : 'none';
      document.getElementById('stats-view').style.display = viewName === 'stats' ? 'block' : 'none';
    }

    function renderCurrentExercise() {
      document.getElementById('day-counter').innerText = `JOUR ${state.currentDay}`;
      document.getElementById('progression-tracker').innerText = `Exo ${state.currentExIndex + 1} / ${defaultWorkout.length}`;

      const ex = defaultWorkout[state.currentExIndex];
      const container = document.getElementById('exercise-container');
      const exKey = `day_${state.currentDay}_ex_${state.currentExIndex}`;
      
      if (!state.exercisesData[exKey]) {
        state.exercisesData[exKey] = {
          img: '',
          sets: Array(ex.sets).fill(null).map(() => ({ weight: '', reps: '' }))
        };
      }

      const exData = state.exercisesData[exKey];

      let setsHTML = exData.sets.map((set, i) => `
        <div class="set-row">
          <div class="set-num">S${i+1}</div>
          <input type="number" placeholder="Kg" value="${set.weight || ''}" onchange="updateSet(${i}, 'weight', this.value)">
          <input type="number" placeholder="Reps" value="${set.reps || ''}" onchange="updateSet(${i}, 'reps', this.value)">
        </div>
      `).join('');

      container.innerHTML = `
        <div class="ex-card">
          <div class="ex-title">${ex.name}</div>
          <div class="img-box">
            ${exData.img ? `<img src="${exData.img}">` : '<span style="color:#666">Aucune image d’exercice</span>'}
          </div>
          <input type="file" id="img-input" accept="image/*" style="display:none" onchange="uploadExImage(event)">
          <button class="upload-btn" onclick="document.getElementById('img-input').click()">📷 Importer / Changer Photo Exo</button>
          
          <div class="sets-header">
            <div>Série</div>
            <div>Poids (kg)</div>
            <div>Répétitions</div>
          </div>
          <div id="sets-list">${setsHTML}</div>
        </div>
      `;

      // Bouton Précédent visible sauf au premier exo
      const prevBtn = document.getElementById('prev-btn');
      prevBtn.style.display = state.currentExIndex > 0 ? 'block' : 'none';

      // Libellé du bouton Suivant / Valider
      document.getElementById('next-btn').innerText = 
        state.currentExIndex === defaultWorkout.length - 1 ? 'Terminer ➔' : 'Suivant ➔';
    }

    function updateSet(index, field, value) {
      const exKey = `day_${state.currentDay}_ex_${state.currentExIndex}`;
      state.exercisesData[exKey].sets[index][field] = value;
      saveData();
    }

    function addSet() {
      const exKey = `day_${state.currentDay}_ex_${state.currentExIndex}`;
      state.exercisesData[exKey].sets.push({ weight: '', reps: '' });
      saveData();
      renderCurrentExercise();
    }

    function uploadExImage(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const exKey = `day_${state.currentDay}_ex_${state.currentExIndex}`;
          state.exercisesData[exKey].img = evt.target.result;
          saveData();
          renderCurrentExercise();
        };
        reader.readAsDataURL(file);
      }
    }

    function nextExercise() {
      if (state.currentExIndex < defaultWorkout.length - 1) {
        state.currentExIndex++;
      } else {
        state.currentDay++;
        state.currentExIndex = 0;
        alert(`Séance terminée ! Rendez-vous au Jour ${state.currentDay} !`);
      }
      saveData();
      renderCurrentExercise();
    }

    function prevExercise() {
      if (state.currentExIndex > 0) {
        state.currentExIndex--;
        saveData();
        renderCurrentExercise();
      }
    }

    function uploadEvoPhoto(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          state.photos.push(evt.target.result);
          saveData();
          renderPhotos();
        };
        reader.readAsDataURL(file);
      }
    }

    function renderPhotos() {
      const grid = document.getElementById('evo-photos-grid');
      grid.innerHTML = state.photos.map(p => `<img src="${p}" style="width:100%; border-radius:8px; height:150px; object-fit:cover;">`).join('');
    }

    renderCurrentExercise();
    renderPhotos();
  </script>
</body>
</html>
