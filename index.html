<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker de Musculation</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #ff4757;
            --accent-green: #2ed573;
            --text-main: #ffffff;
            --text-sub: #a4b0be;
            --border: #2f3542;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            padding-bottom: 80px;
        }

        /* Navigation Onglets */
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-sub);
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .tab-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Cartes Exercice */
        .exercise-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .exercise-title {
            font-size: 1.1rem;
            font-weight: bold;
        }

        /* Direct History & Records */
        .exercise-stats {
            background: #252a34;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 12px;
        }
        .exercise-stats strong { color: #eccc68; }

        /* Rangees de Series */
        .set-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }
        .set-label { width: 65px; font-size: 0.85rem; color: var(--text-sub); }
        input[type="number"], input[type="text"] {
            background: #2f3542;
            border: 1px solid var(--border);
            color: white;
            padding: 8px;
            border-radius: 6px;
            width: 100%;
            font-size: 0.9rem;
        }
        
        /* Buttons */
        .btn-add {
            background: transparent;
            border: 1px dashed var(--accent);
            color: var(--accent);
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .btn-finish {
            background: var(--accent-green);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        /* Banner PR */
        .pr-banner {
            display: none;
            background: #eccc68;
            color: #000;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- NAV TABS -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('workout')">Séance</button>
        <button class="tab-btn" onclick="switchTab('workload')">Charge de Travail</button>
    </div>

    <!-- TAB 1: SEANCE DU JOUR -->
    <div id="tab-workout" class="tab-content active">
        
        <div id="workout-container">
            <!-- Exemple Exercice -->
            <div class="exercise-card" data-exercise="Développé Couché">
                <div class="exercise-header">
                    <span class="exercise-title">Développé Couché</span>
                </div>
                
                <!-- Historique direct & Record 1RM -->
                <div class="exercise-stats">
                    Dernière fois : <strong>80 kg × 8</strong> | 1RM Max : <strong>101 kg</strong>
                </div>

                <div class="pr-banner" id="pr-banner-dc">🏆 NOUVEAU RECORD DETECTÉ !</div>

                <div class="sets-list" id="sets-dc">
                    <div class="set-row">
                        <span class="set-label">Série 1</span>
                        <input type="text" placeholder="ex: 80kg x 8 ou 80kg x 4 + 70kg x 4" class="set-input" onchange="checkPR('Développé Couché', this.value, 'pr-banner-dc')">
                    </div>
                </div>

                <!-- Bouton pour rajouter une serie -->
                <button class="btn-add" onclick="addSet('sets-dc')">+ Rajouter une série</button>
            </div>
        </div>

        <!-- BILAN DE SEANCE -->
        <div class="exercise-card" style="margin-top: 25px;">
            <div class="exercise-title" style="margin-bottom: 10px;">Bilan de la séance</div>
            <label style="font-size: 0.85rem; color: var(--text-sub);">RPE Global / Fatigue (1 à 10) :</label>
            <input type="number" id="rpe-global" min="1" max="10" placeholder="Ex: 8" style="margin-top: 5px;">
            
            <button class="btn-finish" onclick="finishWorkout()">Valider et Enregistrer la Séance</button>
        </div>
    </div>

    <!-- TAB 2: CHARGE DE TRAVAIL -->
    <div id="tab-workload" class="tab-content">
        <div class="exercise-card">
            <div class="exercise-title">Volume Hebdomadaire (Tonnage)</div>
            <p style="color: var(--text-sub); font-size: 0.9rem;">Suivi de la charge accumulée sur la semaine :</p>
            
            <div style="margin-top: 15px;">
                <div style="display:flex; justify-content:space-between; margin-bottom: 5px;">
                    <span>Pectoraux / Triceps</span>
                    <strong>4 250 kg</strong>
                </div>
                <div style="display:flex; justify-content:space-between; margin-bottom: 5px;">
                    <span>Dos / Biceps</span>
                    <strong>5 100 kg</strong>
                </div>
                <div style="display:flex; justify-content:space-between; margin-bottom: 5px;">
                    <span>Jambes</span>
                    <strong>6 800 kg</strong>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Gestion des onglets
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // Rajouter une serie dynamiquement
        function addSet(containerId) {
            const container = document.getElementById(containerId);
            const setCount = container.querySelectorAll('.set-row').length + 1;
            
            const newRow = document.createElement('div');
            newRow.className = 'set-row';
            newRow.innerHTML = `
                <span class="set-label">Série ${setCount}</span>
                <input type="text" placeholder="ex: 80kg x 8 ou 80kg x 4 + 70kg x 4" class="set-input">
            `;
            container.appendChild(newRow);
        }

        // Simulation Detection Automatique de PR (basée sur charge max > 80kg)
        function checkPR(exercise, value, bannerId) {
            const match = value.match(/(\d+)\s*kg/i);
            if (match) {
                const weight = parseInt(match[1]);
                // Seuil d'exemple pour declencher la banniere PR
                if (weight > 80) {
                    document.getElementById(bannerId).style.display = 'block';
                }
            }
        }

        // Fin et validation de seance
        function finishWorkout() {
            const rpe = document.getElementById('rpe-global').value;
            if(!rpe) {
                alert("N'oublie pas de noter ton RPE global avant de valider !");
                return;
            }
            alert(`Séance enregistrée avec succès ! RPE global : ${rpe}/10`);
        }
    </script>
</body>
</html>
